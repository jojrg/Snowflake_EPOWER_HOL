version: 2

models:
  - name: mart_customer_churn
    description: >
      Churn analytics aggregated by product category, region, month, and cancellation reason.
      Includes retention offer success rates.
    columns:
      - name: category_name
        description: Product category of cancelled contract
        tests:
          - not_null
      - name: region
        description: Customer region (North, South, East, West)
      - name: cancellation_month
        description: Month of cancellation
        tests:
          - not_null
      - name: cancellations
        description: Number of cancellations in this group

  - name: mart_nps_analysis
    description: >
      NPS satisfaction metrics by region, customer type, survey category, and month.
      Includes promoter/passive/detractor counts and NPS index.
    columns:
      - name: region
        description: Customer region
        tests:
          - not_null
      - name: customer_type
        description: Customer segment (Privatkunde, Kleingewerbe, Gewerbekunde)
        tests:
          - not_null
      - name: avg_nps
        description: Average NPS score for this group
      - name: nps_index
        description: NPS index = (promoters - detractors) / total * 100

  - name: mart_customer_health
    description: >
      Combined customer health view joining churn and NPS data.
      Segments customers into At Risk, Neutral, Healthy, Champion.
    columns:
      - name: customer_key
        description: Unique customer identifier
        tests:
          - unique
          - not_null
      - name: health_segment
        description: "Customer health: At Risk, Neutral, Healthy, Champion"
        tests:
          - not_null
          - accepted_values:
              values: ['At Risk', 'Neutral', 'Healthy', 'Champion']
